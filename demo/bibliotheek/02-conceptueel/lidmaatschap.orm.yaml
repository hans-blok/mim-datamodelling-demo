naam: lidmaatschap
titel: Lidmaatschap van de openbare bibliotheek
bron: wsob
status: Voorstel van AI, nog niet gecontroleerd door een deskundige.
toelichting: >-
  Het model volgt artikel 12 en 13. Een lidmaatschap is een eigen begrip, omdat het van een persoon is en een of
  beide voorzieningen kan omvatten. Het soort voorziening (fysiek of digitaal) is een waarde, omdat artikel 12 lid 3
  die twee soorten noemt. De geboortedatum zit in het model, omdat de contributievrijstelling van de leeftijd
  afhangt.
aannames:
  - Een lidmaatschap omvat minstens een voorziening. De wet zegt "een fysieke voorziening, de digitale voorziening of beide".
  - De contributie hangt aan het lidmaatschap en niet aan de combinatie van lidmaatschap en voorziening. Dat is een vereenvoudiging voor de demo.
  - De leeftijd volgt uit de geboortedatum en de peildatum van het lidmaatschap. De bron noemt geen peildatum.
  - Contributiebedrag 0,00 betekent dat geen contributie wordt geheven. De wet noemt het bedrag niet.
objecttypen:
  Persoon:
    soort: entiteit
    ref: nr
    type: string
    definitie: Mens die lid van de openbare bibliotheek is of kan worden.
    gebaseerd_op: artikel 12 lid 1
    voorbeelden: [P001, P002, P003]
  Lidmaatschap:
    soort: entiteit
    ref: nr
    type: string
    definitie: Verbintenis van een persoon met de openbare bibliotheek, voor het gebruik van een of beide voorzieningen.
    gebaseerd_op: artikel 12 lid 2
    voorbeelden: [L001, L002, L003]
  Voorziening:
    soort: entiteit
    ref: code
    type: string
    definitie: Plek of dienst van de openbare bibliotheek waar een lid gebruik van kan maken.
    gebaseerd_op: artikel 12 lid 2 en 3
    voorbeelden: [V01, V02]
  Soort voorziening:
    soort: waarde
    type: string
    definitie: Aanduiding of een voorziening fysiek of digitaal is.
    gebaseerd_op: artikel 12 lid 3
    waarden: [fysiek, digitaal]
  Register:
    soort: waarde
    type: string
    definitie: Registratie waarin een ingezetene staat ingeschreven.
    gebaseerd_op: artikel 12 lid 1
    waarden: [basisregistratie personen, basisadministratie BES]
  Geboortedatum:
    soort: waarde
    type: date
    definitie: Datum waarop een persoon is geboren.
    gebaseerd_op: artikel 13 lid 1
    voorbeelden: ["2015-03-12", "1990-07-01"]
  Contributiebedrag:
    soort: waarde
    type: decimal
    definitie: Bedrag in euro dat een lid betaalt voor het lidmaatschap.
    gebaseerd_op: artikel 13 lid 1
    voorbeelden: ["0.00", "40.00"]
feittypen:
  - lezing: "{Persoon} is als ingezetene ingeschreven in {Register}"
    omgekeerd: "{Register} bevat de inschrijving van {Persoon}"
    uniek: [[Persoon, Register]]
    bron: artikel 12 lid 1
    voorbeelden:
      - [P001, basisregistratie personen]
      - [P002, basisregistratie personen]
      - [P003, basisadministratie BES]
  - lezing: "{Persoon} heeft {Geboortedatum}"
    omgekeerd: "{Geboortedatum} is van {Persoon}"
    uniek: [[Persoon]]
    verplicht: [Persoon]
    toelichting: Nodig om te bepalen of iemand jonger is dan achttien jaar.
    gebaseerd_op: artikel 13 lid 1 en 2
    voorbeelden:
      - [P001, "2015-03-12"]
      - [P002, "1990-07-01"]
      - [P003, "1990-07-01"]
  - lezing: "{Lidmaatschap} is van {Persoon}"
    omgekeerd: "{Persoon} heeft {Lidmaatschap}"
    uniek: [[Lidmaatschap]]
    verplicht: [Lidmaatschap]
    bron: artikel 12 lid 1
    voorbeelden:
      - [L001, P001]
      - [L002, P002]
      - [L003, P002]
  - lezing: "{Lidmaatschap} omvat {Voorziening}"
    omgekeerd: "{Voorziening} valt onder {Lidmaatschap}"
    uniek: [[Lidmaatschap, Voorziening]]
    verplicht: [Lidmaatschap]
    bron: artikel 12 lid 2
    voorbeelden:
      - [L001, V01]
      - [L002, V01]
      - [L002, V02]
      - [L003, V02]
  - lezing: "{Voorziening} is van {Soort voorziening}"
    omgekeerd: "{Soort voorziening} is de soort van {Voorziening}"
    uniek: [[Voorziening]]
    verplicht: [Voorziening]
    bron: artikel 12 lid 3
    voorbeelden:
      - [V01, fysiek]
      - [V02, digitaal]
  - lezing: "{Lidmaatschap} heeft {Contributiebedrag}"
    omgekeerd: "{Contributiebedrag} geldt voor {Lidmaatschap}"
    uniek: [[Lidmaatschap]]
    verplicht: [Lidmaatschap]
    toelichting: L001 is van een jongere en kost dus niets, L002 is van een volwassene.
    gebaseerd_op: artikel 13 lid 1 en 2
    voorbeelden:
      - [L001, "0.00"]
      - [L002, "40.00"]
      - [L003, "25.00"]
regels:
  - regel: Een persoon kan alleen lid worden als die als ingezetene is ingeschreven in de basisregistratie personen of in een basisadministratie BES.
    bron: artikel 12 lid 1
  - regel: Een lidmaatschap kan een fysieke voorziening (een lokale bibliotheek), de digitale voorziening (de landelijke digitale bibliotheek) of beide omvatten.
    bron: artikel 12 lid 2 en 3
  - regel: Voor een lidmaatschap van een persoon jonger dan achttien jaar is het Contributiebedrag voor het uitlenen door lokale bibliotheken 0,00.
    bron: artikel 13 lid 1
  - regel: Voor een persoon jonger dan achttien jaar wordt geen tarief, contributie of geldelijke bijdrage vastgesteld voor toegang tot de door de Koninklijke Bibliotheek aangewezen digitale werken.
    bron: artikel 13 lid 2
  - regel: Onze Minister of het college van burgemeester en wethouders of bestuurscollege kan bepalen dat ook andere groepen natuurlijke personen lid kunnen worden. Dit staat niet in het model.
    bron: artikel 12 lid 4
